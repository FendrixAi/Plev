<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; font-src 'self' file:; media-src blob:; img-src data:; connect-src 'none'">
<title>Jam Fokus</title>
<script>(function(){try{var t=localStorage.getItem('jamfokus.theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-experience',localStorage.getItem('jamfokus.homeExperience')==='capybara-world'?'capybara-world':localStorage.getItem('jamfokus.homeExperience')==='mola-world'?'mola-world':'original');if(document.documentElement.getAttribute('data-experience')==='mola-world')document.documentElement.setAttribute('data-theme','light');}catch(e){document.documentElement.setAttribute('data-experience','original');}})();</script>
<link id="original-theme" rel="stylesheet" href="renderer/theme.css">
<script>if(document.documentElement.getAttribute('data-experience')==='capybara-world'){document.getElementById('original-theme').disabled=true;}</script>
<link rel="stylesheet" href="renderer/experiences/capybara-world/beranda.css">
<link rel="stylesheet" href="renderer/experiences/capybara-world/experience.css">
<link rel="stylesheet" href="renderer/experiences/capybara-world/capyrafi.css">
<link rel="stylesheet" href="renderer/experiences/capybara-world/boards.css">
<link rel="stylesheet" href="renderer/experiences/mola-world/mola.css">
<link rel="stylesheet" href="renderer/experiences/mola-world/fx.css">
<link rel="stylesheet" href="renderer/update.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
    <div class="brand">
      <span class="bname">Jam Fokus</span>
      <button type="button" class="ic" id="navToggle" title="Ciutkan navigasi" aria-label="Ciutkan navigasi" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <div class="credit"><span class="app-name">MM</span> - <span class="author">Built by Iqbal Rafi</span></div>

    <nav class="nav" id="nav">
      <button type="button" data-page="beranda" class="on">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Beranda</span>
      </button>
      <button type="button" data-page="tugas">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M8 12l2.5 2.5L16 9.5"/></svg>
        <span>Tugas</span><span class="badge" id="badge-tugas" hidden></span>
      </button>
      <button type="button" data-page="kalender">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
        <span>Kalender</span>
      </button>
      <button type="button" data-page="analitik">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M7.5 15l3.5-4 3 2.5L19 8"/></svg>
        <span>Analitik</span>
      </button>
      <button type="button" data-page="riwayat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12.5" r="7.5"/><path d="M12 9v3.5l2.5 1.5M12 3v2M5 6l1.5 1.5M19 6l-1.5 1.5"/></svg>
        <span>Riwayat fokus</span>
      </button>
      <button type="button" data-page="laporan">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></svg>
        <span>Laporan harian</span>
      </button>
      <button type="button" data-page="goals">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
        <span>Goals</span>
      </button>
      <button type="button" data-page="jurnal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8 3.5v17M11.5 8.5h4M11.5 12h4"/></svg>
        <span>Journaling</span>
      </button>
      <button type="button" data-page="pengaturan">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h7M15 7.5h5M4 16.5h5M13 16.5h7"/><circle cx="13" cy="7.5" r="2.2"/><circle cx="11" cy="16.5" r="2.2"/></svg>
        <span>Pengaturan</span>
      </button>
      <button type="button" data-page="library">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v16H4zM14 4h6v16h-6zM10 8h4M10 12h4M10 16h4"/></svg>
        <span>Library</span>
      </button>
    </nav>

    <div class="side-foot">
      <button type="button" class="mini-btn" id="miniBtn" title="Buka kartu mini">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="12" rx="2"/><path d="M8 20h8"/></svg>
        <span>Kartu mini</span>
      </button>
      <div class="side-status" id="sideStatus" title="Status timer"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="tt">
        <h1 id="pageTitle">Beranda</h1>
        <div class="crumb" id="pageSub"></div>
      </div>
      <div class="top-actions" id="topActions"></div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="Ganti ke mode gelap" title="Ganti ke mode gelap">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </header>

    <div class="music-bar" id="musicBar" role="region" aria-label="Pemutar musik" hidden></div>

    <main class="content" id="content">
      <section class="page" id="page-beranda" data-page="beranda"></section>
      <section class="page" id="page-tugas" data-page="tugas" hidden></section>
      <section class="page" id="page-kalender" data-page="kalender" hidden></section>
      <section class="page" id="page-analitik" data-page="analitik" hidden></section>
      <section class="page" id="page-riwayat" data-page="riwayat" hidden></section>
      <section class="page" id="page-laporan" data-page="laporan" hidden></section>
      <section class="page" id="page-goals" data-page="goals" hidden></section>
      <section class="page" id="page-jurnal" data-page="jurnal" hidden></section>
      <section class="page" id="page-pengaturan" data-page="pengaturan" hidden></section>
      <section class="page" id="page-library" data-page="library" hidden></section>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite" role="status"></div>
