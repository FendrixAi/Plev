<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; media-src blob:; img-src data:; connect-src 'none'">
<title>Jam Fokus</title>
<link rel="stylesheet" href="renderer/theme.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </span>
      <span class="bname">Jam Fokus</span>
      <button type="button" class="ic" id="navToggle" title="Ciutkan navigasi" aria-label="Ciutkan navigasi" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav">
      <button type="button" data-page="beranda" class="on">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Beranda</span>
      </button>
      <button type="button" data-page="tugas">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M8 12l2.5 2.5L16 9.5"/></svg>
        <span>Tugas</span><span class="badge" id="badge-tugas" hidden></span>
      </button>
      <button type="button" data-page="kalender">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
        <span>Kalender</span>
      </button>
      <button type="button" data-page="analitik">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M7.5 15l3.5-4 3 2.5L19 8"/></svg>
        <span>Analitik</span>
      </button>
      <button type="button" data-page="riwayat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12.5" r="7.5"/><path d="M12 9v3.5l2.5 1.5M12 3v2M5 6l1.5 1.5M19 6l-1.5 1.5"/></svg>
        <span>Riwayat Fokus</span>
      </button>
      <button type="button" data-page="laporan">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></svg>
        <span>Laporan Harian</span>
      </button>
      <button type="button" data-page="pengaturan">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h7M15 7.5h5M4 16.5h5M13 16.5h7"/><circle cx="13" cy="7.5" r="2.2"/><circle cx="11" cy="16.5" r="2.2"/></svg>
        <span>Pengaturan</span>
      </button>
    </nav>

    <div class="side-foot">
      <button type="button" class="mini-btn" id="miniBtn" title="Buka kartu mini">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="12" rx="2"/><path d="M8 20h8"/></svg>
        <span>Kartu Mini</span>
      </button>
      <div class="side-status" id="sideStatus" title="Status timer"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="tt">
        <h1 id="pageTitle">Beranda</h1>
        <div class="crumb" id="pageSub"></div>
      </div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <main class="content" id="content">
      <section class="page" id="page-beranda" data-page="beranda"></section>
      <section class="page" id="page-tugas" data-page="tugas" hidden></section>
      <section class="page" id="page-kalender" data-page="kalender" hidden></section>
      <section class="page" id="page-analitik" data-page="analitik" hidden></section>
      <section class="page" id="page-riwayat" data-page="riwayat" hidden></section>
      <section class="page" id="page-laporan" data-page="laporan" hidden></section>
      <section class="page" id="page-pengaturan" data-page="pengaturan" hidden></section>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite" role="status"></div>

<script src="shared/dates.js"></script>
<script src="shared/model.js"></script>
<script src="shared/store.js"></script>
<script src="shared/sessions.js"></script>
<script src="shared/snapshots.js"></script>
<script src="shared/forecast.js"></script>
<script src="shared/migrate.js"></script>
<script src="renderer/ui.js"></script>
<script src="renderer/core.js"></script>
<script src="renderer/clock.js"></script>
<script src="renderer/charts.js"></script>
<script src="renderer/pages/beranda.js"></script>
<script src="renderer/pages/tugas.js"></script>
<script src="renderer/pages/kalender.js"></script>
<script src="renderer/pages/analitik.js"></script>
<script src="renderer/pages/riwayat.js"></script>
<script src="renderer/pages/laporan.js"></script>
<script src="renderer/pages/pengaturan.js"></script>
<script src="renderer/boot.js"></script>
</body>
</html>
