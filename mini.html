<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' file:; font-src file:">
<title>Jam Fokus Mini</title>
<style>
@font-face{font-family:"DM Sans";font-weight:400;font-style:normal;font-display:swap;src:url("renderer/fonts/dm-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"DM Sans";font-weight:500;font-style:normal;font-display:swap;src:url("renderer/fonts/dm-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"DM Sans";font-weight:600;font-style:normal;font-display:swap;src:url("renderer/fonts/dm-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"DM Sans";font-weight:700;font-style:normal;font-display:swap;src:url("renderer/fonts/dm-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Outfit";font-weight:700;font-style:normal;font-display:swap;src:url("renderer/fonts/outfit-latin-700-normal.woff2") format("woff2")}
:root{color-scheme:light;--panel:#FFFFFF;--ink:#17322F;--mute:#546B67;--line:#E5E9E2;--line-2:#D2D9D0;--sand:#F1ECDF;--face:#FBF8F1;--accent:#C8442A;--coral-soft:rgba(238,118,93,.18);--shadow:0 2px 8px rgba(23,50,47,.12),0 4px 16px rgba(23,50,47,.08)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--panel:#1E1E1E;--ink:#E4E4E7;--mute:#A1A1AA;--line:#2E2E33;--line-2:#3F3F46;--sand:#2A2A2A;--face:#141414;--accent:#E5806B;--coral-soft:rgba(229,128,107,.22);--shadow:0 2px 8px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:transparent;overflow:hidden;font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none}
body{padding:8px}
#pill{position:relative;width:280px;height:88px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 10px 0 12px;overflow:hidden;-webkit-app-region:drag}
#pill>svg{width:64px;height:64px;flex:none}
.tx{flex:1;min-width:0}
#lab{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:0.02em}
#cd{font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink)}
#pill[data-mode="run"] #cd,#pill[data-mode="brk"] #cd{color:var(--accent)}
#nm{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;flex-direction:column;gap:6px;-webkit-app-region:no-drag}
button{width:26px;height:26px;border:1px solid var(--line);background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--mute);padding:0;transition:background .12s ease,border-color .12s ease}
button:hover{background:var(--sand);border-color:var(--line-2);color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent)}
button svg{width:14px;height:14px}
#pg{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);border-radius:0 0 22px 22px}
#pill.alarm{border-color:var(--accent);animation:fl 1s ease-in-out 10}
@keyframes fl{50%{box-shadow:0 0 0 3px var(--coral-soft)}}
@media (prefers-reduced-motion:reduce){#pill.alarm{animation:none;box-shadow:0 0 0 3px var(--coral-soft)}}
#pill.warn8{animation:w8 1.2s ease-in-out 3}
@keyframes w8{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){#pill.warn8{animation:none;border-color:var(--accent)}}
</style>
</head>
<body>
<div id="pill" data-mode="idle">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="47" fill="var(--face)" stroke="var(--ink)" stroke-width="4"/>
    <g id="tk"></g>
    <line id="h" x1="50" y1="50" x2="50" y2="27" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    <line id="m" x1="50" y1="50" x2="50" y2="15" stroke="var(--mute)" stroke-width="3" stroke-linecap="round"/>
    <line id="s" x1="50" y1="56" x2="50" y2="11" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3" fill="var(--accent)"/>
  </svg>
  <div class="tx"><div id="lab">Belum ada tugas aktif</div><div id="cd">00:00</div><div id="nm"></div></div>
  <div class="bt">
    <button id="pp" title="Jeda / lanjut" hidden><svg viewBox="0 0 14 14" id="ppi"></svg></button>
    <button id="ex" title="Buka jendela penuh"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h4v4M12 2L7.5 6.5M6 12H2V8M2 12l4.5-4.5"/></svg></button>
  </div>
  <i id="pg"></i>
</div>
<script>
var $=function(i){return document.getElementById(i)},st={mode:"idle"},al=0;
var tk="";for(var i=0;i<12;i++){var a=i*30*Math.PI/180,r1=i%3==0?36:40;
tk+='<line x1="'+(50+r1*Math.sin(a)).toFixed(1)+'" y1="'+(50-r1*Math.cos(a)).toFixed(1)+'" x2="'+(50+44*Math.sin(a)).toFixed(1)+'" y2="'+(50-44*Math.cos(a)).toFixed(1)+'" stroke="var(--mute)" stroke-width="'+(i%3==0?3:1.5)+'"/>';}
$("tk").innerHTML=tk;
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
var PAUSE='<path d="M4 2.5v9M10 2.5v9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',PLAY='<path d="M4 2.5l8 4.5-8 4.5z" fill="currentColor"/>';
var miniCfg={opacity:1,solidOnHover:false},w8t=0;
window.mini.onState(function(s){st=s;});
window.mini.onAlarm(function(){var p=$("pill");p.classList.remove("warn8");p.classList.add("alarm");clearTimeout(al);al=setTimeout(function(){p.classList.remove("alarm");},10000);});
window.mini.onWarn8(function(){var p=$("pill");p.classList.add("warn8");clearTimeout(w8t);w8t=setTimeout(function(){p.classList.remove("warn8");},4000);});
window.mini.onMiniSettings(function(s){miniCfg=s;});
$("pp").onclick=function(){window.mini.cmd("toggle");};
$("ex").onclick=function(){window.mini.cmd("expand");};
$("pill").ondblclick=function(){window.mini.cmd("expand");};
$("pill").addEventListener("mouseenter",function(){window.mini.hover(true);});
$("pill").addEventListener("mouseleave",function(){window.mini.hover(false);});
function frame(){
var n=new Date(),sec=n.getSeconds()+n.getMilliseconds()/1000,mn=n.getMinutes()+sec/60,hr=n.getHours()%12+mn/60;
$("s").setAttribute("transform","rotate("+sec*6+" 50 50)");
$("m").setAttribute("transform","rotate("+mn*6+" 50 50)");
$("h").setAttribute("transform","rotate("+hr*30+" 50 50)");
var rem=0,lab="Belum ada tugas aktif",pp=false;
if(st.mode==="run"){rem=Math.ceil((st.endAt-Date.now())/1000);lab="Sedang berjalan";pp=true;$("ppi").innerHTML=PAUSE;}
else if(st.mode==="pause"){rem=st.left;lab="Dijeda";pp=true;$("ppi").innerHTML=PLAY;}
else if(st.mode==="brk"){rem=Math.ceil((st.endAt-Date.now())/1000);lab="Istirahat";}
else if(st.done){lab="Selesai";}
$("pill").dataset.mode=st.mode||"idle";
$("lab").textContent=lab;$("cd").textContent=fmt(rem);$("nm").textContent=st.name||"";$("pp").hidden=!pp;
var act=st.mode==="run"||st.mode==="pause"||st.mode==="brk";
$("pg").style.width=act&&st.total?(100*(1-rem/st.total))+"%":"0";
requestAnimationFrame(frame);}
frame();window.mini.ready();
</script>
</body>
</html>
